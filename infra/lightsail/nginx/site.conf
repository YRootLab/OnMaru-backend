server {
    listen 80;
    listen [::]:80;
    server_name api.onmaru.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /_nginx_health {
        access_log off;
        return 204;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.onmaru.site;

    ssl_certificate /etc/letsencrypt/live/api.onmaru.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.onmaru.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    location = /actuator {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://spring-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 130s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 10m;
    }
}
