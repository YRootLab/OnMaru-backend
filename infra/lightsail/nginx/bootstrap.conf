server {
    listen 80;
    listen [::]:80;
    server_name api.onmaru.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /_nginx_health {
        access_log off;
        return 204;
    }

    location / {
        return 503;
    }
}
