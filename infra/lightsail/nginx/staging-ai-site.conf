server {
    listen 80;
    listen [::]:80;
    server_name staging-ai.onmaru.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging-ai.onmaru.site;

    ssl_certificate /etc/letsencrypt/live/staging-ai.onmaru.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-ai.onmaru.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    # The staging AI service stays private (no host port publish, Issue #807).
    # Only the readiness probe consumed by the staging smoke and release benchmark
    # is proxied publicly; every other AI path must not leave the app network.
    location = /ready {
        resolver 127.0.0.11 ipv6=off valid=5s;
        set $staging_ai_upstream staging-ai-engine:8000;
        proxy_pass http://$staging_ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 504 = @staging_ai_asleep;
    }

    location / {
        return 404;
    }

    location @staging_ai_asleep {
        add_header Retry-After 60 always;
        return 503;
    }
}
