name: onmaru-lightsail

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-spring-api: &spring-api
  image: ${ONMARU_SPRING_IMAGE:?Set ONMARU_SPRING_IMAGE to an immutable GHCR image digest}
  restart: unless-stopped
  cpus: 0.55
  expose:
    - "8080"
  environment: &spring-environment
    SPRING_PROFILES_ACTIVE: production
    SERVER_FORWARD_HEADERS_STRATEGY: native
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=15.0
    ONMARU_SECRETS_SOURCE: environment
    ONMARU_DISCOVERY_API_ENABLED: ${ONMARU_DISCOVERY_API_ENABLED:-false}
    ONMARU_DISCOVERY_API_RATE_LIMIT_PER_MINUTE: ${ONMARU_DISCOVERY_API_RATE_LIMIT_PER_MINUTE:-120}
    ONMARU_DB_URL: jdbc:postgresql://postgres:5432/${ONMARU_POSTGRES_DB}
    ONMARU_DB_RUNTIME_USER: ${ONMARU_DB_RUNTIME_USER}
    ONMARU_DB_RUNTIME_PASSWORD: ${ONMARU_DB_RUNTIME_PASSWORD}
    ONMARU_DB_MIGRATION_USER: ${ONMARU_DB_MIGRATION_USER}
    ONMARU_DB_MIGRATION_PASSWORD: ${ONMARU_DB_MIGRATION_PASSWORD}
    ONMARU_CORS_ALLOWED_ORIGINS: ${ONMARU_CORS_ALLOWED_ORIGINS:-https://onmaru.site,https://www.onmaru.site}
    ONMARU_DATALAB_VISITOR_SERVICE_KEY: ${ONMARU_DATALAB_VISITOR_SERVICE_KEY:?Set the DataLab visitor service key in .env}
    ONMARU_OAUTH_KAKAO_CLIENTID: ${ONMARU_OAUTH_KAKAO_CLIENTID:?Set the Kakao REST API key in .env}
    ONMARU_OAUTH_KAKAO_REDIRECTURI: ${ONMARU_OAUTH_KAKAO_REDIRECTURI:-https://api.onmaru.site/auth/kakao/callback}
    ONMARU_OAUTH_KAKAO_FRONTENDBASEURL: ${ONMARU_OAUTH_KAKAO_FRONTENDBASEURL:-https://www.onmaru.site}
    ONMARU_SECRET_TOURAPI_SERVICE_KEY_CURRENT: ${ONMARU_SECRET_TOURAPI_SERVICE_KEY_CURRENT:?Set the TourAPI service key in .env}
    ONMARU_SECRET_ODII_SERVICE_KEY_CURRENT: ${ONMARU_SECRET_ODII_SERVICE_KEY_CURRENT:?Set the Odii service key in .env}
    ONMARU_SECRET_GEMINI_API_KEY_CURRENT: ${ONMARU_SECRET_GEMINI_API_KEY_CURRENT:?Set the Gemini API key in .env}
    ONMARU_SECRET_OAUTH_CLIENT_SECRET_CURRENT: ${ONMARU_SECRET_OAUTH_CLIENT_SECRET_CURRENT:?Generate an OAuth signing secret in .env}
    ONMARU_SECRET_ADMIN_JWT_SIGNING_KEY_CURRENT: ${ONMARU_SECRET_ADMIN_JWT_SIGNING_KEY_CURRENT:?Generate the admin JWT signing secret in .env}
    ONMARU_SECRET_ADMIN_CURSOR_SIGNING_KEY_CURRENT: ${ONMARU_SECRET_ADMIN_CURSOR_SIGNING_KEY_CURRENT:?Generate an admin cursor signing secret in .env}
    ONMARU_SECRET_OTLP_EXPORTER_TOKEN_CURRENT: ${ONMARU_SECRET_OTLP_EXPORTER_TOKEN_CURRENT:?Set the OTLP token or a unique disabled placeholder in .env}
    ONMARU_SECRET_MODERATION_OPERATOR_TOKEN_CURRENT: ${ONMARU_SECRET_MODERATION_OPERATOR_TOKEN_CURRENT:?Generate a moderation operator token in .env}
    ONMARU_SECRET_DATALAB_OPERATIONS_TOKEN_CURRENT: ${ONMARU_SECRET_DATALAB_OPERATIONS_TOKEN_CURRENT:?Generate a DataLab operations token in .env}
    ONMARU_OTLP_METRICS_ENABLED: "false"
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - app
    - database
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 45s
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.5
    environment:
      POSTGRES_DB: ${ONMARU_POSTGRES_DB:?Set ONMARU_POSTGRES_DB in .env}
      POSTGRES_USER: ${ONMARU_POSTGRES_ADMIN_USER:?Set ONMARU_POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${ONMARU_POSTGRES_ADMIN_PASSWORD:?Set ONMARU_POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      ONMARU_DB_RUNTIME_USER: ${ONMARU_DB_RUNTIME_USER:?Set ONMARU_DB_RUNTIME_USER in .env}
      ONMARU_DB_RUNTIME_PASSWORD: ${ONMARU_DB_RUNTIME_PASSWORD:?Set ONMARU_DB_RUNTIME_PASSWORD in .env}
      ONMARU_DB_MIGRATION_USER: ${ONMARU_DB_MIGRATION_USER:?Set ONMARU_DB_MIGRATION_USER in .env}
      ONMARU_DB_MIGRATION_PASSWORD: ${ONMARU_DB_MIGRATION_PASSWORD:?Set ONMARU_DB_MIGRATION_PASSWORD in .env}
      ONMARU_DB_READONLY_USER: ${ONMARU_DB_READONLY_USER:?Set ONMARU_DB_READONLY_USER in .env}
      ONMARU_DB_READONLY_PASSWORD: ${ONMARU_DB_READONLY_PASSWORD:?Set ONMARU_DB_READONLY_PASSWORD in .env}
      ONMARU_DB_BACKUP_USER: ${ONMARU_DB_BACKUP_USER:?Set ONMARU_DB_BACKUP_USER in .env}
      ONMARU_DB_BACKUP_PASSWORD: ${ONMARU_DB_BACKUP_PASSWORD:?Set ONMARU_DB_BACKUP_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/restore:/opt/onmaru/restore:ro
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT 1 FROM pg_extension WHERE extname = 'postgis'" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # Kept only for the one-time transition from the original single Spring
  # container. Normal deployments use the blue and green slots below.
  spring-api:
    <<: *spring-api
    profiles: [legacy]
    mem_limit: 448m
    cpus: 1.2

  spring-blue:
    <<: *spring-api
    mem_limit: 384m
    environment:
      <<: *spring-environment
      ONMARU_TOURAPI_SYNC_ON_STARTUP: "false"
      ONMARU_ODII_SYNC_ON_STARTUP: "false"

  spring-green:
    <<: *spring-api
    mem_limit: 384m
    environment:
      <<: *spring-environment
      ONMARU_TOURAPI_SYNC_ON_STARTUP: "false"
      ONMARU_ODII_SYNC_ON_STARTUP: "false"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_SITE_CONFIG:-./nginx/bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_STAGING_SITE_CONFIG:-./nginx/staging-bootstrap.conf}:/etc/nginx/conf.d/staging.conf:ro
      - ./nginx/runtime:/etc/nginx/onmaru:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/_nginx_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot:latest
    profiles: [tls]
    command:
      - certonly
      - --non-interactive
      - --webroot
      - -w
      - /var/www/certbot
      - -d
      - api.onmaru.site
      - --email
      - ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
      - --agree-tos
      - --no-eff-email
    environment:
      CERTBOT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    logging: *default-logging

networks:
  app: {}
  database:
    internal: true

volumes:
  postgres-data:
  letsencrypt:
  certbot-webroot:
