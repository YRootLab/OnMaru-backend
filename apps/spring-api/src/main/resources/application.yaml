server:
  port: ${PORT:8080}

spring:
  application:
    name: onmaru-spring-api
  datasource:
    url: ${ONMARU_DB_URL:}
    username: ${ONMARU_DB_RUNTIME_USER:}
    password: ${ONMARU_DB_RUNTIME_PASSWORD:}
  flyway:
    locations: classpath:db/migration/baseline
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history
    user: ${ONMARU_DB_MIGRATION_USER:${ONMARU_DB_RUNTIME_USER:}}
    password: ${ONMARU_DB_MIGRATION_PASSWORD:${ONMARU_DB_RUNTIME_PASSWORD:}}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

onmaru:
  secrets:
    source: ${ONMARU_SECRETS_SOURCE:fake}
  audio:
    dataset: ${ONMARU_AUDIO_DATASET:odii-audio}
    category: ${ONMARU_AUDIO_CATEGORY:오디오 관광}
    public-hosts: ${ONMARU_AUDIO_PUBLIC_HOSTS:}
  tourapi:
    client:
      connect-timeout: 1s
      attempt-timeout: 5s
      page-timeout: 12s
      retry-count: 2
    sync:
      base-uri: ${ONMARU_TOURAPI_BASE_URI:https://apis.data.go.kr/B551011/KorService2}
      mobile-app: ${ONMARU_TOURAPI_MOBILE_APP:OnMaru}
      page-size: ${ONMARU_TOURAPI_PAGE_SIZE:1000}
      cron: "${ONMARU_TOURAPI_SYNC_CRON:0 0 3 * * *}"
  odii:
    client:
      connect-timeout: 1s
      attempt-timeout: 5s
      page-timeout: 12s
      retry-count: 2
    sync:
      base-uri: ${ONMARU_ODII_BASE_URI:https://apis.data.go.kr/B551011/Odii}
      mobile-app: ${ONMARU_ODII_MOBILE_APP:OnMaru}
      # 전체 수집(storyBasedSyncList)이 기본이며, keywords는 호환/롤백 source에서만 사용한다.
      keywords: ${ONMARU_ODII_KEYWORDS:한옥,고택,전통마을,궁궐,성곽,문화유산,역사문화,전통시장}
      page-size: ${ONMARU_ODII_PAGE_SIZE:100}
      cron: "${ONMARU_ODII_SYNC_CRON:0 0 3 * * *}"
  datalab:
    visitor:
      base-uri: "${ONMARU_DATALAB_VISITOR_BASE_URI:https://apis.data.go.kr/B551011/DataLabService}"
      service-key: "${ONMARU_DATALAB_VISITOR_SERVICE_KEY:}"
      mobile-app: "${ONMARU_DATALAB_VISITOR_MOBILE_APP:OnMaru}"
      connect-timeout: "${ONMARU_DATALAB_VISITOR_CONNECT_TIMEOUT:1s}"
      attempt-timeout: "${ONMARU_DATALAB_VISITOR_ATTEMPT_TIMEOUT:5s}"
      page-timeout: "${ONMARU_DATALAB_VISITOR_PAGE_TIMEOUT:12s}"
      retry-count: ${ONMARU_DATALAB_VISITOR_RETRY_COUNT:2}
      page-size: ${ONMARU_DATALAB_VISITOR_PAGE_SIZE:100}
      sync:
        cron: "${ONMARU_DATALAB_VISITOR_SYNC_CRON:0 30 3 * * *}"
  map:
    info:
      db-statement-timeout: "${ONMARU_MAP_INFO_DB_STATEMENT_TIMEOUT:1500ms}"
      slow-query-threshold: "${ONMARU_MAP_INFO_SLOW_QUERY_THRESHOLD:500ms}"
      api-timeout: "${ONMARU_MAP_INFO_API_TIMEOUT:2s}"
      cache-ttl: "${ONMARU_MAP_INFO_CACHE_TTL:30s}"
      profile-version: "${ONMARU_MAP_INFO_PROFILE_VERSION:map-zoom-v1}"
      cache-max-entries: "${ONMARU_MAP_INFO_CACHE_MAX_ENTRIES:256}"

management:
  otlp:
    metrics:
      export:
        enabled: ${ONMARU_OTLP_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/metrics}}
        headers:
          Authorization: ${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:}
  tracing:
    sampling:
      probability: ${ONMARU_TRACE_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.yrootlab.onmaru: DEBUG
    org.springdoc: INFO
    org.springframework.web: INFO

---

spring:
  config:
    activate:
      on-profile: production
  flyway:
    url: ${ONMARU_DB_URL}
