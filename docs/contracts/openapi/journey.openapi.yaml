openapi: 3.1.0
info:
  title: OnMaru Journey API
  version: 1.3.0-draft
  description: >-
    Current public contract for AI journey commands and snapshots. AI journey alone uses
    REST command plus SSE notification; PostgreSQL-backed snapshots remain authoritative.
    An exploration is the stable conversation resource; there is no separate thread ID.
servers:
  - url: /api/v1
security:
  - OnMaruSession: []
  - OnMaruGuest: []
paths:
  /explorations:
    get:
      operationId: listExplorations
      summary: List conversations available to the current actor
      description: >-
        Member-owned conversations do not expire automatically and remain until explicitly deleted
        or account deletion. Guest-owned conversations expire 24 hours after creation. A member may
        also see an exploration covered by a valid guest-to-member grant. Results are ordered by
        updatedAt DESC, explorationId DESC. Full paged turns are loaded from the turns resource.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Conversation summaries available to the current member or guest
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExplorationPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
    post:
      operationId: createExploration
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExplorationRequest' }
      responses:
        '202': { description: Run accepted, headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RunAccepted' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}:
    get:
      operationId: getExploration
      parameters: [ { $ref: '#/components/parameters/ExplorationId' } ]
      responses:
        '200':
          description: >-
            Authoritative exploration snapshot. When latestRun is present, its sequence
            is the current public SSE high-water mark for reconnect and duplicate filtering.
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExplorationSnapshot' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteExploration
      summary: Delete one conversation and its turns/runs
      description: >-
        Only the actual guest/member owner may delete the conversation. A guest-to-member grant
        allows continuation but does not grant deletion of the guest-owned exploration. The
        exploration is hidden immediately, any active run is cancelled, and stored turns/result
        snapshots are physically removed by the deletion worker within 24 hours.
      parameters:
        - $ref: '#/components/parameters/ExplorationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Deleted or already deleted by the current owner, headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}/turns:
    get:
      operationId: listExplorationTurns
      summary: Read the conversation transcript in pages
      description: >-
        Returns the owner-visible original user query with the corresponding sanitized structured assistant result snapshot.
        Items are ordered createdAt DESC, turnId DESC; the client reverses a page for chronological
        rendering. A cursor continues toward older turns. The newest active/pending turn may have
        response.status=PENDING. Text deltas are not part of the transcript contract.
      parameters:
        - $ref: '#/components/parameters/ExplorationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of user and structured assistant turn history
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ExplorationTurnPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTurn
      parameters:
        - $ref: '#/components/parameters/ExplorationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTurnRequest' }
      responses:
        '202': { description: Run accepted, headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RunAccepted' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}/actions:
    post:
      operationId: applyExplorationAction
      description: >-
        Applies a state-versioned command. Reusing commandId with the same payload returns
        the original response; reuse with a different payload returns IDEMPOTENCY_CONFLICT.
      parameters:
        - $ref: '#/components/parameters/ExplorationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionCommandRequest' }
      responses:
        '200': { description: Authoritative snapshot after the command, headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ExplorationSnapshot' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}/runs/{runId}:
    get:
      operationId: getRun
      parameters: [ { $ref: '#/components/parameters/ExplorationId' }, { $ref: '#/components/parameters/RunId' } ]
      responses:
        '200':
          description: >-
            Authoritative run snapshot including the last committed Spring SSE sequence.
            After reset or terminal notification, this snapshot determines the UI state.
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}/runs/{runId}/events:
    get:
      operationId: streamRunEvents
      description: >-
        Notification channel only. The client must GET run and exploration snapshots after
        terminal, reset, reconnect, or tab restore. Event payload follows journey-sse-event.schema.json.
        First release emits run.stage, heartbeat, reset, auth_closed and run.terminal; run.text.delta
        is not emitted or rendered in this release.
        Last-Event-ID is the Spring-assigned per-run sequence. If the requested cursor is
        outside the replay window, ahead of the current sequence, or cannot be continued
        after restart, the server emits reset without an id; the client fetches snapshots,
        closes this EventSource, and opens a fresh stream without a stale cursor.
      parameters:
        - $ref: '#/components/parameters/ExplorationId'
        - $ref: '#/components/parameters/RunId'
        - name: Last-Event-ID
          in: header
          required: false
          description: Last Spring SSE sequence received by this EventSource; 0 is valid before the first event.
          schema: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
      responses:
        '200':
          description: >-
            text/event-stream. A fresh stream emits the current RUNNING run.stage snapshot
            once when stage is non-null (using its existing sequence, without incrementing
            it); a QUEUED run may send heartbeat until it enters a stage. A terminal run
            emits its terminal notification and closes. Auth expiry may close with
            auth_closed/data 0 instead of JSON.
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }
          content:
            text/event-stream:
              schema: { type: string }
              examples:
                interpreting:
                  summary: Input preparation mapped to the public interpretation stage
                  value: |-
                    id: 1
                    event: run.stage
                    data: {"schemaVersion":"1.3","runId":"c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f","sequence":1,"status":"RUNNING","stage":"INTERPRETING"}
                retrieving:
                  summary: Retrieval started
                  value: |-
                    id: 2
                    event: run.stage
                    data: {"schemaVersion":"1.3","runId":"c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f","sequence":2,"status":"RUNNING","stage":"RETRIEVING"}
                selectingEvidence:
                  summary: Evidence selection started
                  value: |-
                    id: 3
                    event: run.stage
                    data: {"schemaVersion":"1.3","runId":"c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f","sequence":3,"status":"RUNNING","stage":"SELECTING_EVIDENCE"}
                generating:
                  summary: Answer generation started
                  value: |-
                    id: 4
                    event: run.stage
                    data: {"schemaVersion":"1.3","runId":"c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f","sequence":4,"status":"RUNNING","stage":"GENERATING"}
                validating:
                  summary: FastAPI output check or Spring final validation
                  value: |-
                    id: 5
                    event: run.stage
                    data: {"schemaVersion":"1.3","runId":"c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f","sequence":5,"status":"RUNNING","stage":"VALIDATING"}
                persisting:
                  summary: Spring persistence started
                  value: |-
                    id: 6
                    event: run.stage
                    data: {"schemaVersion":"1.3","runId":"c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f","sequence":6,"status":"RUNNING","stage":"PERSISTING"}
                reset:
                  summary: Replay cursor cannot be resumed
                  value: |-
                    event: reset
                    data: {"schemaVersion":"1.3","runId":"c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f"}
                terminal:
                  summary: Terminal is a notification; snapshot remains authoritative
                  value: |-
                    id: 7
                    event: run.terminal
                    data: {"schemaVersion":"1.3","runId":"c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f","sequence":7,"status":"COMPLETED","outcome":"PROPOSAL"}
        '404': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/ExplorationId'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '200': { description: Current terminal or cancelled snapshot, headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /saved-journeys:
    post:
      operationId: createSavedJourney
      security:
        - OnMaruSession: []
      description: Save a committed exploration owned by the current member; conceal another actor's exploration as 404.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavedJourneyRequest' }
      responses:
        '200': { description: Existing save for the same exploration version, headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SavedJourney' } } } }
        '201': { description: Saved journey created, headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SavedJourney' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listSavedJourneys
      security:
        - OnMaruSession: []
      description: List only saved journeys owned by the current member.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Saved journeys ordered by savedAt DESC and id DESC
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SavedJourneyPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /saved-journeys/{savedJourneyId}:
    get:
      operationId: getSavedJourney
      security:
        - OnMaruSession: []
      parameters: [ { $ref: '#/components/parameters/SavedJourneyId' } ]
      responses:
        '200':
          description: Read-only saved journey snapshot
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SavedJourney' } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSavedJourney
      security:
        - OnMaruSession: []
      parameters:
        - $ref: '#/components/parameters/SavedJourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 'Deleted or already deleted by the owning member', headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /saved-journeys/{savedJourneyId}/resume:
    post:
      operationId: resumeSavedJourney
      security:
        - OnMaruSession: []
      parameters:
        - $ref: '#/components/parameters/SavedJourneyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201': { description: New exploration created from currently available resources, headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ResumeSavedJourneyResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    OnMaruSession:
      type: apiKey
      in: cookie
      name: __Host-onmaru-session
      description: Authenticated member session; cookie is HttpOnly and is never read by FE code.
    OnMaruGuest:
      type: apiKey
      in: cookie
      name: __Host-onmaru-guest
      description: Opaque guest credential; exploration access is limited to the owning browser and 24-hour lifetime.
  parameters:
    ExplorationId: { name: explorationId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    SavedJourneyId: { name: savedJourneyId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    CsrfToken: { name: X-CSRF-TOKEN, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 256 } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque actor/filter/limit-bound cursor; expires after 10 minutes. On 410, restart from the first page.
      schema: { type: string, minLength: 1, maxLength: 2048 }
  responses:
    Error:
      description: Error envelope
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  headers:
    NoStore:
      schema: { type: string, const: no-store }
    RetryAfter:
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
  schemas:
    CreateExplorationRequest:
      type: object
      additionalProperties: false
      required: [query, locale]
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        locale: { type: string, const: ko-KR }
        regionCode: { type: [string, 'null'], maxLength: 32 }
    CreateTurnRequest:
      type: object
      additionalProperties: false
      required: [clientTurnId, baseVersion, query]
      properties:
        clientTurnId: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 0 }
        query: { type: string, minLength: 1, maxLength: 1000 }
        clarificationAnswer:
          oneOf:
            - $ref: '#/components/schemas/ClarificationAnswer'
            - type: 'null'
    ClarificationAnswer:
      type: object
      additionalProperties: false
      required: [clarificationId, choiceId, text]
      oneOf:
        - properties:
            choiceId: { type: string, minLength: 1 }
            text: { type: 'null' }
        - properties:
            choiceId: { type: 'null' }
            text: { type: string, minLength: 1, maxLength: 1000 }
      properties:
        clarificationId: { type: string, minLength: 1 }
        choiceId: { type: [string, 'null'], minLength: 1 }
        text: { type: [string, 'null'], minLength: 1, maxLength: 1000 }
    ActionCommandRequest:
      type: object
      additionalProperties: false
      required: [commandId, baseVersion, action]
      properties:
        commandId: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 0 }
        action:
          oneOf:
            - $ref: '#/components/schemas/ResourceAction'
            - $ref: '#/components/schemas/ProposalAction'
          discriminator:
            propertyName: type
            mapping:
              PIN: '#/components/schemas/ResourceAction'
              UNPIN: '#/components/schemas/ResourceAction'
              EXCLUDE: '#/components/schemas/ResourceAction'
              UNEXCLUDE: '#/components/schemas/ResourceAction'
              APPLY_PROPOSAL: '#/components/schemas/ProposalAction'
              DISMISS_PROPOSAL: '#/components/schemas/ProposalAction'
    ResourceAction:
      type: object
      additionalProperties: false
      required: [type, resourceRef]
      properties:
        type: { type: string, enum: [PIN, UNPIN, EXCLUDE, UNEXCLUDE] }
        resourceRef: { $ref: '#/components/schemas/PlaceRef' }
    ProposalAction:
      type: object
      additionalProperties: false
      required: [type, proposalId]
      properties:
        type: { type: string, enum: [APPLY_PROPOSAL, DISMISS_PROPOSAL] }
        proposalId: { type: string, format: uuid }
    CreateSavedJourneyRequest:
      type: object
      additionalProperties: false
      required: [explorationId, baseVersion, title]
      properties:
        explorationId: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 80 }
    RunAccepted:
      type: object
      additionalProperties: false
      required: [schemaVersion, explorationId, runId, stateVersion, runUrl, eventsUrl, snapshotUrl]
      properties:
        schemaVersion: { type: string, const: '1.3' }
        explorationId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        stateVersion: { type: integer, minimum: 0 }
        runUrl: { type: string }
        eventsUrl: { type: string }
        snapshotUrl: { type: string }
    RunSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, runId, status, engine, degradedReason, stage, sequence, outcome, clarification, retryAfterMs, createdAt, startedAt, deadlineAt, error]
      oneOf:
        - properties:
            status: { const: QUEUED }
            stage: { type: 'null' }
            outcome: { type: 'null' }
            clarification: { type: 'null' }
            startedAt: { type: 'null' }
            error: { type: 'null' }
        - properties:
            status: { const: RUNNING }
            stage: { type: string, enum: [INTERPRETING, RETRIEVING, SELECTING_EVIDENCE, GENERATING, VALIDATING, PERSISTING] }
            outcome: { type: 'null' }
            clarification: { type: 'null' }
            startedAt: { type: string, format: date-time }
            error: { type: 'null' }
        - properties:
            status: { const: COMPLETED }
            stage: { type: 'null' }
            outcome: { type: string, enum: [INITIAL_BOARD, PROPOSAL, NO_RESULTS] }
            clarification: { type: 'null' }
            error: { type: 'null' }
        - properties:
            status: { const: COMPLETED }
            stage: { type: 'null' }
            outcome: { const: CLARIFICATION_REQUIRED }
            clarification: { $ref: '#/components/schemas/RunClarification' }
            error: { type: 'null' }
        - properties:
            status: { const: FAILED }
            stage: { type: 'null' }
            outcome: { type: 'null' }
            clarification: { type: 'null' }
            error: { $ref: '#/components/schemas/RunError' }
        - properties:
            status: { const: CANCELLED }
            stage: { type: 'null' }
            outcome: { type: 'null' }
            clarification: { type: 'null' }
            error: { type: 'null' }
      properties:
        schemaVersion: { type: string, const: '1.3' }
        runId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED] }
        engine: { type: string, enum: [LLM, BASELINE] }
        degradedReason: { type: [string, 'null'], enum: [AI_QUOTA_EXCEEDED, AI_TIMEOUT, AI_INVALID_RESPONSE, AI_SERVICE_UNAVAILABLE, null] }
        stage:
          type: [string, 'null']
          enum: [INTERPRETING, RETRIEVING, SELECTING_EVIDENCE, GENERATING, VALIDATING, PERSISTING, null]
          description: >-
            Public Spring-owned stage. FastAPI progress maps PREPARING_INPUT to
            INTERPRETING, RETRIEVING to RETRIEVING, SELECTING_EVIDENCE to itself,
            GENERATING to itself, and CHECKING_OUTPUT to VALIDATING. Spring final
            validation remains VALIDATING; persistence is PERSISTING.
        sequence:
          type: integer
          minimum: 0
          description: >-
            Highest Spring-owned per-run SSE event sequence committed with this snapshot.
            QUEUED starts at 0; each new public event advances it once. A terminal snapshot
            includes the sequence of its run.terminal event. FastAPI ordinal is never exposed.
        outcome: { type: [string, 'null'], enum: [INITIAL_BOARD, PROPOSAL, CLARIFICATION_REQUIRED, NO_RESULTS, null] }
        clarification:
          anyOf:
            - $ref: '#/components/schemas/RunClarification'
            - type: 'null'
        retryAfterMs: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        deadlineAt: { type: string, format: date-time }
        error: { anyOf: [ { $ref: '#/components/schemas/RunError' }, { type: 'null' } ] }
    RunClarification:
      type: object
      additionalProperties: false
      required: [id, reason, question, choices, allowFreeText]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        reason: { type: string, enum: [REGION_MISSING, REGION_AMBIGUOUS, UNSUPPORTED_CONDITION] }
        question: { type: string, minLength: 1, maxLength: 200 }
        choices: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/ClarificationChoice' } }
        allowFreeText: { type: boolean }
    ClarificationChoice:
      type: object
      additionalProperties: false
      required: [id, label, regionCode]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        label: { type: string, minLength: 1, maxLength: 100 }
        regionCode: { type: [string, 'null'], maxLength: 32 }
    PlaceRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, const: PLACE }
        id: { type: string, minLength: 1, maxLength: 128 }
    RegionRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, const: REGION }
        id: { type: string, minLength: 1, maxLength: 128 }
    TopicRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, const: TOPIC }
        id: { type: string, minLength: 1, maxLength: 128 }
    ResourceRef:
      oneOf:
        - $ref: '#/components/schemas/PlaceRef'
        - $ref: '#/components/schemas/RegionRef'
        - $ref: '#/components/schemas/TopicRef'
      discriminator: { propertyName: type }
    GeoPoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracy]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: string, enum: [EXACT, APPROXIMATE] }
    ImageAsset:
      type: object
      additionalProperties: false
      required: [url, alt, sourceName]
      properties:
        url: { type: string, format: uri }
        alt: { type: string, maxLength: 200 }
        sourceName: { type: string, minLength: 1, maxLength: 100 }
    PlaceResource:
      type: object
      additionalProperties: false
      required: [ref, title, category, regionRef, summary, image, location, sourceRefs, unavailableFields]
      properties:
        ref: { $ref: '#/components/schemas/PlaceRef' }
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 100 }
        regionRef: { $ref: '#/components/schemas/RegionRef' }
        summary: { type: [string, 'null'], maxLength: 1000 }
        image: { anyOf: [ { $ref: '#/components/schemas/ImageAsset' }, { type: 'null' } ] }
        location: { anyOf: [ { $ref: '#/components/schemas/GeoPoint' }, { type: 'null' } ] }
        sourceRefs: { type: array, items: { type: string }, uniqueItems: true }
        unavailableFields: { type: array, items: { type: string }, uniqueItems: true }
    RegionResource:
      type: object
      additionalProperties: false
      required: [ref, title]
      properties:
        ref: { $ref: '#/components/schemas/RegionRef' }
        title: { type: string, minLength: 1, maxLength: 200 }
    TopicResource:
      type: object
      additionalProperties: false
      required: [ref, title, description]
      properties:
        ref: { $ref: '#/components/schemas/TopicRef' }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 1000 }
    Evidence:
      type: object
      additionalProperties: false
      required: [id, kind, sourceName, sourceUrl, sourceRevision, summary, asOf]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [PROVIDER_FIELD, EDITORIAL_NOTE, SPATIAL_CALCULATION] }
        sourceName: { type: string, minLength: 1, maxLength: 100 }
        sourceUrl: { type: [string, 'null'], format: uri }
        sourceRevision: { type: [string, 'null'] }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        asOf: { type: [string, 'null'], format: date-time }
    Relation:
      type: object
      additionalProperties: false
      required: [id, sourceRef, targetRef, type, label, evidenceRefs]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        sourceRef: { $ref: '#/components/schemas/ResourceRef' }
        targetRef: { $ref: '#/components/schemas/ResourceRef' }
        type: { type: string, enum: [LOCATED_IN, NEARBY, SHARES_VERIFIED_TOPIC, EDITORIAL_PAIRING] }
        label: { type: string, minLength: 1, maxLength: 200 }
        evidenceRefs: { type: array, items: { type: string }, uniqueItems: true }
    ConstraintCheck:
      type: object
      additionalProperties: false
      required: [key, status, label, evidenceRefs]
      properties:
        key: { type: string, enum: [REGION, TOPIC, PACE, TIME_BUDGET] }
        status: { type: string, enum: [SATISFIED, VIOLATED, UNKNOWN] }
        label: { type: string, minLength: 1, maxLength: 200 }
        evidenceRefs: { type: array, items: { type: string }, uniqueItems: true }
    JourneyCandidate:
      type: object
      additionalProperties: false
      required: [placeRef, reason, evidenceRefs, relationRefs, constraintChecks]
      properties:
        placeRef: { $ref: '#/components/schemas/PlaceRef' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        evidenceRefs: { type: array, items: { type: string }, uniqueItems: true }
        relationRefs: { type: array, items: { type: string }, uniqueItems: true }
        constraintChecks: { type: array, items: { $ref: '#/components/schemas/ConstraintCheck' } }
    JourneyLeg:
      type: object
      additionalProperties: false
      required: [fromRef, toRef, order, distanceMeters, distanceKind, distanceBand]
      properties:
        fromRef: { $ref: '#/components/schemas/PlaceRef' }
        toRef: { $ref: '#/components/schemas/PlaceRef' }
        order: { type: integer, minimum: 0 }
        distanceMeters: { type: [integer, 'null'], minimum: 0 }
        distanceKind: { type: string, enum: [STRAIGHT_LINE, UNKNOWN] }
        distanceBand: { type: string, enum: [NEAR, MEDIUM, FAR, UNKNOWN] }
    JourneyBoard:
      type: object
      additionalProperties: false
      required: [title, querySummary, regionRef, candidates, legs, resources, relations, evidence]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        querySummary: { type: string, minLength: 1, maxLength: 500 }
        regionRef: { $ref: '#/components/schemas/RegionRef' }
        candidates: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/JourneyCandidate' } }
        legs: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/JourneyLeg' } }
        resources:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/PlaceResource'
              - $ref: '#/components/schemas/RegionResource'
              - $ref: '#/components/schemas/TopicResource'
        relations: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Relation' } }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
    JourneyProposal:
      type: object
      additionalProperties: false
      required: [id, baseVersion, expiresAt, status, keptRefs, addedRefs, removedRefs, orderedRefs, board, unknowns]
      properties:
        id: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, INVALIDATED] }
        keptRefs: { type: array, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
        addedRefs: { type: array, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
        removedRefs: { type: array, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
        orderedRefs: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
        board: { $ref: '#/components/schemas/JourneyBoard' }
        unknowns: { type: array, items: { type: string } }
    JourneyHistoryItem:
      type: object
      additionalProperties: false
      required: [id, type, createdAt, query, runId, stateVersion, proposalId, affectedRefs]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [QUERY_SUBMITTED, BOARD_COMMITTED, PIN_CHANGED, PROPOSAL_READY, PROPOSAL_APPLIED, PROPOSAL_DISMISSED, RUN_FAILED] }
        createdAt: { type: string, format: date-time }
        query: { type: [string, 'null'] }
        runId: { type: [string, 'null'], format: uuid }
        stateVersion: { type: integer, minimum: 0 }
        proposalId: { type: [string, 'null'], format: uuid }
        affectedRefs: { type: array, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
    JourneyExecution:
      type: object
      additionalProperties: false
      required: [dataMode, engine, rankingVersion, datasetRevision]
      properties:
        dataMode: { type: string, minLength: 1 }
        engine: { type: string, enum: [BASELINE, LLM] }
        rankingVersion: { type: string, minLength: 1 }
        datasetRevision: { type: string, minLength: 1 }
    ExplorationSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, explorationId, stateVersion, board, pinnedRefs, excludedRefs, unavailableRefs, execution, latestRun, pendingProposal, recentHistory, updatedAt]
      properties:
        schemaVersion: { type: string, const: '1.3' }
        explorationId: { type: string, format: uuid }
        stateVersion: { type: integer, minimum: 0 }
        board: { anyOf: [ { $ref: '#/components/schemas/JourneyBoard' }, { type: 'null' } ] }
        pinnedRefs: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
        excludedRefs: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
        unavailableRefs: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
        execution: { $ref: '#/components/schemas/JourneyExecution' }
        latestRun: { anyOf: [ { $ref: '#/components/schemas/RunSnapshot' }, { type: 'null' } ] }
        pendingProposal: { anyOf: [ { $ref: '#/components/schemas/JourneyProposal' }, { type: 'null' } ] }
        recentHistory: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/JourneyHistoryItem' } }
        updatedAt: { type: string, format: date-time }
    ExplorationSummary:
      type: object
      additionalProperties: false
      required: [explorationId, title, lastUserQueryPreview, latestRunStatus, candidateCount, pinnedCount, updatedAt]
      properties:
        explorationId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 100, description: Safe display title derived from validated journey scope; not an editable title in v1. }
        lastUserQueryPreview: { type: [string, 'null'], maxLength: 160, description: Owner-visible preview of the original user query; never used as model memory or telemetry. }
        latestRunStatus: { type: [string, 'null'], enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED, null] }
        candidateCount: { type: integer, minimum: 0, maximum: 3 }
        pinnedCount: { type: integer, minimum: 0, maximum: 3 }
        updatedAt: { type: string, format: date-time }
    ExplorationPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, items, totalCount, nextCursor, hasMore]
      properties:
        schemaVersion: { type: string, const: '1.3' }
        items: { type: array, items: { $ref: '#/components/schemas/ExplorationSummary' } }
        totalCount: { type: integer, format: int64, minimum: 0 }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    ExplorationTurnPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, items, nextCursor, hasMore]
      properties:
        schemaVersion: { type: string, const: '1.3' }
        items: { type: array, items: { $ref: '#/components/schemas/ExplorationTurn' } }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    ExplorationTurn:
      type: object
      additionalProperties: false
      required: [turnId, query, createdAt, runId, response]
      properties:
        turnId: { type: string, format: uuid }
        query: { type: string, minLength: 1, maxLength: 1000, description: Original accepted user query for the owning actor's transcript display. Never include in logs, metrics, traces, or quality tools. }
        createdAt: { type: string, format: date-time }
        runId: { type: [string, 'null'], format: uuid }
        response: { $ref: '#/components/schemas/TurnResponse' }
    TurnResponse:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            status: { const: PENDING }
            outcome: { type: 'null' }
            summary: { type: 'null' }
            board: { type: 'null' }
            proposal: { type: 'null' }
            clarification: { type: 'null' }
            error: { type: 'null' }
        - properties:
            status: { const: COMPLETED }
            outcome: { const: INITIAL_BOARD }
            board: { $ref: '#/components/schemas/JourneyBoard' }
            proposal: { type: 'null' }
            clarification: { type: 'null' }
            error: { type: 'null' }
        - properties:
            status: { const: COMPLETED }
            outcome: { const: PROPOSAL }
            board: { type: 'null' }
            proposal: { $ref: '#/components/schemas/JourneyProposal' }
            clarification: { type: 'null' }
            error: { type: 'null' }
        - properties:
            status: { const: COMPLETED }
            outcome: { const: CLARIFICATION_REQUIRED }
            board: { type: 'null' }
            proposal: { type: 'null' }
            clarification: { $ref: '#/components/schemas/RunClarification' }
            error: { type: 'null' }
        - properties:
            status: { const: COMPLETED }
            outcome: { const: NO_RESULTS }
            board: { type: 'null' }
            proposal: { type: 'null' }
            clarification: { type: 'null' }
            error: { type: 'null' }
        - properties:
            status: { const: FAILED }
            outcome: { type: 'null' }
            summary: { type: 'null' }
            board: { type: 'null' }
            proposal: { type: 'null' }
            clarification: { type: 'null' }
            error: { $ref: '#/components/schemas/RunError' }
        - properties:
            status: { const: CANCELLED }
            outcome: { type: 'null' }
            summary: { type: 'null' }
            board: { type: 'null' }
            proposal: { type: 'null' }
            clarification: { type: 'null' }
            error: { type: 'null' }
      description: >-
        Immutable sanitized result captured for this turn. PENDING has all result members null;
        COMPLETED has a non-null outcome and optional matching board/proposal/clarification;
        FAILED has only error non-null; CANCELLED has no result payload.
      required: [status, outcome, summary, board, proposal, clarification, error]
      properties:
        status: { type: string, enum: [PENDING, COMPLETED, FAILED, CANCELLED] }
        outcome: { type: [string, 'null'], enum: [INITIAL_BOARD, PROPOSAL, CLARIFICATION_REQUIRED, NO_RESULTS, null] }
        summary: { type: [string, 'null'], maxLength: 500, description: Plain text grounded summary; render as text, never as HTML. }
        board: { anyOf: [ { $ref: '#/components/schemas/JourneyBoard' }, { type: 'null' } ] }
        proposal: { anyOf: [ { $ref: '#/components/schemas/JourneyProposal' }, { type: 'null' } ] }
        clarification: { anyOf: [ { $ref: '#/components/schemas/RunClarification' }, { type: 'null' } ] }
        error: { anyOf: [ { $ref: '#/components/schemas/RunError' }, { type: 'null' } ] }
    RunError:
      type: object
      additionalProperties: false
      required: [code, requestId]
      description: Safe public error code only; provider message, stack and prompt are never exposed.
      properties:
        code: { type: string, enum: [SERVICE_UNAVAILABLE, AI_SERVICE_UNAVAILABLE, AI_INVALID_RESPONSE, AI_TIMEOUT, SAFETY_BLOCKED, JOURNEY_SCOPE_UNSUPPORTED] }
        requestId: { type: string, minLength: 1, maxLength: 128 }
    SavedJourneySummary:
      type: object
      additionalProperties: false
      required: [savedJourneyId, title, sourceExplorationId, sourceVersion, savedAt, candidateCount]
      properties:
        savedJourneyId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 80 }
        sourceExplorationId: { type: [string, 'null'], format: uuid }
        sourceVersion: { type: integer, minimum: 0 }
        savedAt: { type: string, format: date-time }
        candidateCount: { type: integer, minimum: 1, maximum: 3 }
    SavedJourney:
      type: object
      additionalProperties: false
      required: [savedJourneyId, title, sourceExplorationId, sourceVersion, savedAt, candidateCount, snapshot]
      properties:
        savedJourneyId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 80 }
        sourceExplorationId: { type: [string, 'null'], format: uuid }
        sourceVersion: { type: integer, minimum: 0 }
        savedAt: { type: string, format: date-time }
        candidateCount: { type: integer, minimum: 1, maximum: 3 }
        snapshot: { $ref: '#/components/schemas/SavedJourneySnapshot' }
    SavedJourneySnapshot:
      description: Immutable sanitized snapshot without run, proposal, history, raw turn, or actor data.
      type: object
      additionalProperties: false
      required: [schemaVersion, board, pinnedRefs, excludedRefs, execution, updatedAt]
      properties:
        schemaVersion: { type: string, const: '1.2' }
        board: { $ref: '#/components/schemas/SavedJourneyBoard' }
        pinnedRefs: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
        excludedRefs: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
        execution: { $ref: '#/components/schemas/JourneyExecution' }
        updatedAt: { type: string, format: date-time }
    SavedJourneyBoard:
      description: Committed board that stores only canonical region/topic refs instead of a free-text query summary.
      type: object
      additionalProperties: false
      required: [title, summaryRefs, regionRef, candidates, legs, resources, relations, evidence]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        summaryRefs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            oneOf:
              - $ref: '#/components/schemas/RegionRef'
              - $ref: '#/components/schemas/TopicRef'
        regionRef: { $ref: '#/components/schemas/RegionRef' }
        candidates: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/JourneyCandidate' } }
        legs: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/JourneyLeg' } }
        resources:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/PlaceResource'
              - $ref: '#/components/schemas/RegionResource'
              - $ref: '#/components/schemas/TopicResource'
        relations: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Relation' } }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
    SavedJourneyPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, items, totalCount, nextCursor, hasMore]
      properties:
        schemaVersion: { type: string, const: '1.2' }
        items: { type: array, items: { $ref: '#/components/schemas/SavedJourneySummary' } }
        totalCount: { type: integer, format: int64, minimum: 0 }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    ResumeSavedJourneyResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, exploration, unavailableRefs]
      properties:
        schemaVersion: { type: string, const: '1.2' }
        exploration: { $ref: '#/components/schemas/ExplorationSnapshot' }
        unavailableRefs: { type: array, items: { $ref: '#/components/schemas/PlaceRef' }, uniqueItems: true }
    Error:
      type: object
      additionalProperties: false
      required: [schemaVersion, code, message, requestId, details]
      description: >-
        Journey AI의 HTTP 429 응답은 기존 오류 필드와 함께 classification=RATE_LIMITED,
        status=429 호환 필드를 반환한다. 다른 오류에는 이 두 필드가 없다.
        Retry-After 헤더는 초, details.retryAfterMs는 밀리초 단위다.
      if:
        properties:
          code: { const: RATE_LIMITED }
      then:
        required: [classification, status]
      else:
        not:
          anyOf:
            - required: [classification]
            - required: [status]
      properties:
        schemaVersion: { type: string, const: '1.2' }
        code:
          type: string
          enum: [AUTH_REQUIRED, CSRF_INVALID, NOT_FOUND, VALIDATION_ERROR, RATE_LIMITED, PAYLOAD_TOO_LARGE, JOURNEY_SCOPE_UNSUPPORTED, PRIVACY_REDACT_REQUIRED, SAFETY_BLOCKED, SERVICE_UNAVAILABLE, VERSION_CONFLICT, ACTIVE_RUN, PINNED_REF, IDEMPOTENCY_CONFLICT, PROPOSAL_EXPIRED, SAVE_LIMIT, CURSOR_INVALID, CURSOR_EXPIRED]
        message: { type: string }
        requestId: { type: string }
        details: { type: object }
        classification: { type: string, const: RATE_LIMITED }
        status: { type: integer, const: 429 }
