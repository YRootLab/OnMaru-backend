openapi: 3.1.0
info:
  title: OnMaru Journey API
  version: 1.2.0-draft
  description: >-
    Current public contract for AI journey commands and snapshots. AI journey alone uses
    REST command plus SSE notification; PostgreSQL-backed snapshots remain authoritative.
servers:
  - url: /api/v1
paths:
  /explorations:
    post:
      operationId: createExploration
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExplorationRequest' }
      responses:
        '202': { description: Run accepted, content: { application/json: { schema: { $ref: '#/components/schemas/RunAccepted' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}:
    get:
      operationId: getExploration
      parameters: [ { $ref: '#/components/parameters/ExplorationId' } ]
      responses:
        '200': { description: Authoritative exploration snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/ExplorationSnapshot' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}/turns:
    post:
      operationId: createTurn
      parameters:
        - $ref: '#/components/parameters/ExplorationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTurnRequest' }
      responses:
        '202': { description: Run accepted, content: { application/json: { schema: { $ref: '#/components/schemas/RunAccepted' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}/runs/{runId}:
    get:
      operationId: getRun
      parameters: [ { $ref: '#/components/parameters/ExplorationId' }, { $ref: '#/components/parameters/RunId' } ]
      responses:
        '200': { description: Authoritative run snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}/runs/{runId}/events:
    get:
      operationId: streamRunEvents
      description: >-
        Notification channel only. The client must GET run and exploration snapshots after
        terminal, reset, reconnect, or tab restore. Event payload follows journey-sse-event.schema.json.
      parameters:
        - $ref: '#/components/parameters/ExplorationId'
        - $ref: '#/components/parameters/RunId'
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '200': { description: text/event-stream; event schema is a sibling JSON Schema, content: { text/event-stream: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /explorations/{explorationId}/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/ExplorationId'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '200': { description: Current terminal or cancelled snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } } }
        '409': { $ref: '#/components/responses/Error' }
components:
  parameters:
    ExplorationId: { name: explorationId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    CreateExplorationRequest:
      type: object
      additionalProperties: false
      required: [query, locale]
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        locale: { type: string, const: ko-KR }
        regionCode: { type: [string, 'null'], maxLength: 32 }
    CreateTurnRequest:
      type: object
      additionalProperties: false
      required: [clientTurnId, baseVersion, query]
      properties:
        clientTurnId: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 0 }
        query: { type: string, minLength: 1, maxLength: 1000 }
        clarificationAnswer: { type: [object, 'null'] }
    RunAccepted:
      type: object
      additionalProperties: false
      required: [schemaVersion, explorationId, runId, stateVersion, runUrl, eventsUrl, snapshotUrl]
      properties:
        schemaVersion: { type: string, const: '1.2' }
        explorationId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        stateVersion: { type: integer, minimum: 0 }
        runUrl: { type: string }
        eventsUrl: { type: string }
        snapshotUrl: { type: string }
    RunSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, runId, status, engine, degradedReason, stage, outcome, clarification, retryAfterMs, createdAt, startedAt, deadlineAt, error]
      properties:
        schemaVersion: { type: string, const: '1.2' }
        runId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED] }
        engine: { type: string, enum: [LLM, BASELINE] }
        degradedReason: { type: [string, 'null'], enum: [AI_QUOTA_EXCEEDED, AI_TIMEOUT, AI_INVALID_RESPONSE, AI_SERVICE_UNAVAILABLE, null] }
        stage: { type: [string, 'null'], enum: [INTERPRETING, RETRIEVING, VALIDATING, PERSISTING, null] }
        outcome: { type: [string, 'null'], enum: [INITIAL_BOARD, PROPOSAL, CLARIFICATION_REQUIRED, NO_RESULTS, null] }
        clarification: { type: [object, 'null'] }
        retryAfterMs: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        deadlineAt: { type: string, format: date-time }
        error: { type: [object, 'null'] }
    ExplorationSnapshot:
      type: object
      additionalProperties: true
      required: [schemaVersion, explorationId, stateVersion, latestRun]
      properties:
        schemaVersion: { type: string, const: '1.2' }
        explorationId: { type: string, format: uuid }
        stateVersion: { type: integer, minimum: 0 }
        latestRun: { anyOf: [ { $ref: '#/components/schemas/RunSnapshot' }, { type: 'null' } ] }
    Error:
      type: object
      additionalProperties: false
      required: [schemaVersion, code, message, requestId, details]
      properties:
        schemaVersion: { type: string, const: '1.2' }
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: object }
