name: Module Benchmark

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/module-benchmark.yml'
      - '.github/benchmark-modules.yml'
      - 'scripts/ci/**'
      - 'scripts/benchmark/**'
      - 'scripts/test/**'
      - 'scripts/verify-contracts'
      - '**/src/test/**'
      - 'ai/tests/**'
      - 'ai/pyproject.toml'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'build-logic/**'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    uses: YRootLab/OnMaru-backend-ci-toolkit/.github/workflows/module-benchmark.yml@7ecbb89aae771604d9c1c532cf123f239e279110
    with:
      catalog_path: .github/benchmark-modules.yml
      toolkit_ref: 7ecbb89aae771604d9c1c532cf123f239e279110
      mode: develop
      max_parallel: 4
      baseline_ref: develop
      comment_mode: none

  summary:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summarize module benchmark evidence
        env:
          BENCHMARK_JOB: ${{ needs.benchmark.result }}
          RESULT: ${{ needs.benchmark.outputs.result }}
          COMPARISON_ID: ${{ needs.benchmark.outputs.comparison_id }}
          MANIFEST_URI: ${{ needs.benchmark.outputs.manifest_uri }}
          REPORT_ARTIFACT: ${{ needs.benchmark.outputs.report_artifact }}
          LONGEST_MODULE_SECONDS: ${{ needs.benchmark.outputs.longest_module_duration_seconds }}
          DAG_PATH_QUALITY: ${{ needs.benchmark.outputs.dag_critical_path_quality }}
        run: |
          {
            printf '## Module Benchmark\n\n'
            printf '| Field | Value |\n| --- | --- |\n'
            printf '| Job | %s |\n' "${BENCHMARK_JOB:-unavailable}"
            printf '| Result | %s |\n' "${RESULT:-unavailable}"
            printf '| Comparison ID | %s |\n' "${COMPARISON_ID:-unavailable}"
            printf '| Manifest URI | %s |\n' "${MANIFEST_URI:-unavailable}"
            printf '| Report artifact | %s |\n' "${REPORT_ARTIFACT:-unavailable}"
            printf '| Longest module (seconds) | %s |\n' "${LONGEST_MODULE_SECONDS:-unavailable}"
            printf '| DAG critical path quality | %s |\n' "${DAG_PATH_QUALITY:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
