name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hygiene: ${{ steps.lanes.outputs.hygiene }}
      java: ${{ steps.lanes.outputs.java }}
      contract: ${{ steps.lanes.outputs.contract }}
      ai: ${{ steps.lanes.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected CI lanes
        id: lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_FILES="$RUNNER_TEMP/changed-files.txt"
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES"
          else
            git ls-files > "$CHANGED_FILES"
          fi
          node scripts/ci/select-ci-lanes.mjs --changed-files "$CHANGED_FILES" --github-output "$GITHUB_OUTPUT"

  hygiene:
    needs: plan
    if: ${{ needs.plan.outputs.hygiene == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Repository hygiene and Node validation
        run: |
          git diff --check
          test -d docs
          test -f docs/database/schema.md
          test -L docs/backend_schema_design_guide.md
          test -L docs/specs
          if [ "${{ github.event_name }}" = pull_request ]; then node scripts/print-branch-issue.mjs "${{ github.head_ref }}"; fi
          node --test scripts/test/*.test.mjs
          node scripts/verify-planning-inputs.mjs
          node scripts/validate-odii-fixtures.mjs

  java:
    needs: plan
    if: ${{ needs.plan.outputs.java == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Run shared-workspace Java test lane
        run: |
          ./gradlew \
            :adapters:tourism-api:test \
            :modules:insights:test \
            :modules:catalog:test \
            :modules:audio:test \
            :modules:community:test \
            :modules:identity:test \
            :modules:journey:test \
            :modules:operations:test \
            :apps:spring-api:test \
            --no-daemon \
            -Ponmaru.ci.performance.enabled=true

  contract:
    needs: plan
    if: ${{ needs.plan.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/test/requirements-contract.txt
      - name: Contract validator tests
        run: |
          python3 -m pip install -r scripts/test/requirements-contract.txt
          python3 -m pytest scripts/test/test_contract_validation.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public contract and generated artifact validation
        run: bash scripts/verify-contracts

  ai:
    needs: plan
    if: ${{ needs.plan.outputs.ai == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: FastAPI quality gates
        run: |
          uv python install 3.12
          cd ai && uv run pytest
          cd ..
          bash scripts/test/run-ai-evals.test.sh
          uv run --project ai python scripts/run-ai-evals --input ai/evals/journey-held-out-v1.json --output "${RUNNER_TEMP}/ai-eval-report.json" --schema-output "${RUNNER_TEMP}/ai-eval-report.schema.json"
          cmp ai/evals/report.schema.json "${RUNNER_TEMP}/ai-eval-report.schema.json"
          cd ai && uv run ruff check && uv run mypy

  verify:
    needs: [plan, hygiene, java, contract, ai]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce required lane results
        env:
          HYGIENE_ENABLED: ${{ needs.plan.outputs.hygiene }}
          JAVA_ENABLED: ${{ needs.plan.outputs.java }}
          CONTRACT_ENABLED: ${{ needs.plan.outputs.contract }}
          AI_ENABLED: ${{ needs.plan.outputs.ai }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          AI_RESULT: ${{ needs.ai.result }}
        run: node scripts/ci/verify-ci-lanes.mjs
