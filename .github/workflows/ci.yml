name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Repository hygiene
        run: |
          git diff --check
          test -d docs
          test -f docs/database/schema.md
          test -L docs/backend_schema_design_guide.md
          test -L docs/specs

      - name: Work branch issue parser
        if: github.event_name == 'pull_request'
        run: node scripts/print-branch-issue.mjs "${{ github.head_ref }}"

      - name: Node script tests
        run: node --test scripts/test/*.test.mjs

      - name: Planning input snapshot validation
        run: node scripts/verify-planning-inputs.mjs

      - name: Odii fixture manifest validation
        run: node scripts/validate-odii-fixtures.mjs

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for public contract validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/test/requirements-contract.txt

      - name: Install public contract validation dependencies
        run: python3 -m pip install -r scripts/test/requirements-contract.txt

      - name: Contract validator tests
        run: python3 -m pytest scripts/test/test_contract_validation.py

      - name: Set up Node.js for DBML validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Public contract and generated artifact validation
        run: bash scripts/verify-contracts

  module-tests:
    permissions:
      contents: read
    uses: YRootLab/OnMaru-backend-ci-toolkit/.github/workflows/module-benchmark.yml@ff3028ae728de076ea38aa56135529c1566f25a8
    with:
      catalog_path: .github/benchmark-modules.yml
      toolkit_ref: ff3028ae728de076ea38aa56135529c1566f25a8
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'develop' }}
      max_parallel: 4
      baseline_ref: develop
      comment_mode: none

  verify:
    needs: [hygiene, contract, module-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fan-in verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce required fan-in result
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          MODULE_JOB_RESULT: ${{ needs.module-tests.result }}
          TOOLKIT_RESULT: ${{ needs.module-tests.outputs.result }}
          MANIFEST_URI: ${{ needs.module-tests.outputs.manifest_uri }}
          REPORT_ARTIFACT: ${{ needs.module-tests.outputs.report_artifact }}
        run: |
          {
            printf '## Required CI fan-in\n\n'
            printf '| Lane | Result |\n| --- | --- |\n'
            printf '| hygiene | `%s` |\n' "$HYGIENE_RESULT"
            printf '| contract | `%s` |\n' "$CONTRACT_RESULT"
            printf '| module-tests | `%s` |\n' "$MODULE_JOB_RESULT"
            printf '| Toolkit result | `%s` |\n' "$TOOLKIT_RESULT"
            printf '| Manifest | `%s` |\n' "$MANIFEST_URI"
            printf '| Report artifact | `%s` |\n' "$REPORT_ARTIFACT"
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/verify-fan-in.mjs
