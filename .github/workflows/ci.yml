name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository hygiene
        run: |
          git diff --check
          test -d docs
          test -f docs/database/schema.md
          test -L docs/backend_schema_design_guide.md
          test -L docs/specs

      - name: Set up JDK 21 for backend
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: TourAPI adapter tests
        run: ./gradlew :adapters:tourism-api:test --no-daemon

      - name: Catalog module tests
        run: ./gradlew :modules:catalog:test --no-daemon

      - name: Operations module tests
        run: ./gradlew :modules:operations:test --no-daemon

      - name: Spring API tests
        run: ./gradlew :apps:spring-api:test --no-daemon

      - name: Node script tests
        run: node --test scripts/test/*.test.mjs

      - name: Planning input snapshot validation
        run: node scripts/verify-planning-inputs.mjs

      - name: Odii fixture manifest validation
        run: node scripts/validate-odii-fixtures.mjs

      - name: Set up Python for public contract validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/test/requirements-contract.txt

      - name: Install public contract validation dependencies
        run: python3 -m pip install -r scripts/test/requirements-contract.txt

      - name: Contract validator tests
        run: python3 -m pytest scripts/test/test_contract_validation.py

      - name: Set up Node.js for DBML validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Public contract and generated artifact validation
        run: bash scripts/verify-contracts

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12 for FastAPI service
        run: uv python install 3.12

      - name: FastAPI service quality gates
        working-directory: ai
        run: uv run pytest

      - name: FastAPI lint and typecheck
        working-directory: ai
        run: |
          uv run ruff check
          uv run mypy
