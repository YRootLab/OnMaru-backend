name: Gemini AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              console.error("❌ GEMINI_API_KEY가 GitHub Secrets에 설정되지 않았습니다.");
              return;
            }

            // 1. PR의 변경된 파일 목록 및 상세 Diff 가져오기
            console.log(`PR #${pull_number}의 파일 목록 분석 중...`);
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number,
            });

            const diffResponse = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
              headers: { accept: 'application/vnd.github.v3.diff' }
            });
            const diffText = diffResponse.data;

            if (!diffText || diffText.trim() === '') {
              console.log("변경 사항이 없습니다.");
              return;
            }

            // 파일 확장자/경로를 분석하여 백엔드/문서 여부 체크
            let hasBackend = false;
            let hasDocs = false;

            files.forEach(file => {
              const filename = file.filename;
              if (filename.endsWith('.md') || filename.startsWith('docs/')) {
                hasDocs = true;
              } else {
                // Java, Kotlin, Python, Go, JS/TS 백엔드 소스코드 및 SQL, 설정 파일들
                hasBackend = true;
              }
            });

            // 2. 역할 및 프롬프트 정의 (상황별 맞춤 리뷰어 페르소나 주입)
            let reviewerPersona = "";
            let evaluationCriteria = "";

            if (hasBackend && !hasDocs) {
              reviewerPersona = "시니어 백엔드 소프트웨어 엔지니어 (Node.js & Supabase 전문)";
              evaluationCriteria = `
              - Node.js 비동기 처리(async/await, Promise 에러 핸들링), 가독성 및 컨벤션
              - Supabase 클라이언트 사용법의 적절성 및 API 호출 최적화
              - RLS(Row Level Security) 정책 및 데이터베이스 보안(SQL Injection, 권한 분리)
              - PostgreSQL 데이터베이스 성능(쿼리 튜닝, 인덱싱 활용, 효율적인 조인)
              - Supabase Edge Functions 및 DB 트리거/함수의 아키텍처적 적합성
              `;
            } else if (hasDocs && !hasBackend) {
              reviewerPersona = "전문 테크니컬 라이터 (Technical Writer)";
              evaluationCriteria = `
              - 기술 문서의 가독성 및 문맥 흐름의 매끄러움
              - 맞춤법, 띄어쓰기, 문장 표현의 정확성 및 오탈자 검출
              - API 스펙 및 데이터 구조 정의의 완성도와 누락 여부
              - 마크다운 문법 및 구조적 포맷팅 가독성
              `;
            } else {
              reviewerPersona = "시니어 백엔드 엔지니어(Node.js/Supabase 전문) & 기술 문서 전문가";
              evaluationCriteria = `
              - [백엔드 코드]: Node.js 비동기 로직 효율성, Supabase API 활용 및 RLS 보안, PostgreSQL 쿼리 최적화 및 예외 처리 검토
              - [문서 파일]: 기술 문서의 가독성, 맞춤법 및 오탈자 검사, API 스펙 및 데이터 구조 정의의 완성도 검토
              `;
            }


            const prompt = `당신은 대한민국 최고의 개발자이자 ${reviewerPersona}입니다.
            전달된 Git Diff를 면밀히 분석하고 코드 리뷰 피드백을 작성해 주세요.

            [작성 시 절대 규칙 (CRITICAL RULES)]
            1. **반드시 100% 한국어로만 작성하세요.** 영어나 다른 언어로 답변하지 마십시오.
            2. 각 분야의 전문가다운 전문 용어를 사용하되, 쉽고 정중한 어조(해요체 또는 하십시오체)로 답변하세요.
            3. 개선할 부분이 없을 경우 무리해서 지적하지 말고, 코드의 훌륭한 점을 칭찬하고 독려하는 긍정적인 메시지를 작성해 주세요.

            [평가 항목 기준]
            ${evaluationCriteria}

            [피드백 작성 구조]
            1. **변경 사항 요약**: 무엇이 어떻게 변경되었는지 간단 요약
            2. **세부 리뷰 의견**: (각 분야 기준에 맞추어 보완이 필요한 부분 제시)
               - 💡 **보안 & 안정성** (문제가 있을 때만 작성)
               - ⚙️ **코드 개선 및 최적화** (구체적인 대안 코드 예시 제안 환영)
               - 👏 **좋았던 부분** (잘 작성된 부분에 대한 칭찬)

            [Git Diff]
            \`\`\`diff
            ${diffText.substring(0, 50000)}
            \`\`\``;

            // 3. 구글 Gemini API 호출 (가장 빠른 응답을 주는 gemini-1.5-flash 모델 사용)
            console.log("Gemini API 호출 중...");
            const model = "gemini-1.5-flash"; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

            const requestBody = {
              contents: [{
                parts: [{ text: prompt }]
              }],
              generationConfig: {
                temperature: 0.2
              }
            };

            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
              const errText = await response.text();
              throw new Error(`Gemini API 호출 실패: ${response.status} - ${errText}`);
            }

            const resData = await response.json();
            const reviewText = resData.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!reviewText) {
              throw new Error("Gemini로부터 올바른 응답을 받지 못했습니다.");
            }

            // 4. PR 댓글 달기
            const commentBody = `🤖 **Gemini AI 코드 리뷰어 피드백 (${reviewerPersona})**:\n\n${reviewText}`;
            
            console.log("PR에 리뷰 코멘트를 등록하는 중...");
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: commentBody
            });

            console.log("코드 리뷰 등록 완료!");
