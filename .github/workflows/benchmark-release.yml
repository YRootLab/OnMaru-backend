name: Release Benchmark Gate

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to benchmark
        required: true
        type: string
      baseline_release_tag:
        description: Optional previous successful release tag
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: benchmark-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SPRING_IMAGE: ghcr.io/yrootlab/onmaru-backend/spring-api
  AI_IMAGE: ghcr.io/yrootlab/onmaru-backend/ai-service

jobs:
  build-and-scan:
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      spring-digest: ${{ steps.spring-build.outputs.digest }}
      ai-digest: ${{ steps.ai-build.outputs.digest }}
      release-tag: ${{ steps.release-input.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release-input
        shell: bash
        run: |
          TAG='${{ inputs.release_tag || github.ref_name }}'
          echo "release-tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: spring-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.SPRING_IMAGE }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SPRING_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-spring-api.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
      - id: ai-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai/Dockerfile
          push: true
          tags: ${{ env.AI_IMAGE }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.AI_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-ai-service.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Create release metadata input
        env:
          SPRING_DIGEST: ${{ steps.spring-build.outputs.digest }}
          AI_DIGEST: ${{ steps.ai-build.outputs.digest }}
        run: |
          mkdir -p artifacts/release/${{ steps.release-input.outputs.release-tag }}
          node scripts/benchmark/workflow-support.mjs metadata \
            --tag '${{ steps.release-input.outputs.release-tag }}' --sha '${{ github.sha }}' --workflow-run-id '${{ github.run_id }}' \
            --spring-expected "$SPRING_DIGEST" --spring-deployed "$SPRING_DIGEST" \
            --ai-expected "$AI_DIGEST" --ai-deployed "$AI_DIGEST" \
            --output artifacts/release/${{ steps.release-input.outputs.release-tag }}/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ steps.release-input.outputs.release-tag }}
          path: artifacts/release/${{ steps.release-input.outputs.release-tag }}/release.json
          retention-days: 14

  migration-gate:
    if: github.event.repository.fork != true
    needs: build-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - run: bash scripts/verify-contracts
      - name: Reuse staging migration gate
        env:
          ONMARU_DB_MIGRATION_USER: ${{ secrets.ONMARU_STAGING_DB_MIGRATION_USER }}
          ONMARU_DB_RUNTIME_USER: ${{ secrets.ONMARU_STAGING_DB_RUNTIME_USER }}
        run: |
          test -n "$ONMARU_DB_MIGRATION_USER"
          test -n "$ONMARU_DB_RUNTIME_USER"
          test "$ONMARU_DB_MIGRATION_USER" != "$ONMARU_DB_RUNTIME_USER"
          ./gradlew :apps:spring-api:test --tests '*Migration*' --no-daemon

  staging-readiness:
    if: github.event.repository.fork != true
    needs: [build-and-scan, migration-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    outputs:
      spring-deployed-digest: ${{ steps.digest.outputs.spring-deployed }}
      ai-deployed-digest: ${{ steps.digest.outputs.ai-deployed }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging URLs and deployed digests
        id: digest
        env:
          STAGING_SPRING_URL: ${{ vars.STAGING_SPRING_URL }}
          STAGING_AI_URL: ${{ vars.STAGING_AI_URL }}
          SPRING_EXPECTED: ${{ needs.build-and-scan.outputs.spring-digest }}
          AI_EXPECTED: ${{ needs.build-and-scan.outputs.ai-digest }}
          SPRING_DEPLOYED: ${{ vars.STAGING_SPRING_DEPLOYED_DIGEST }}
          AI_DEPLOYED: ${{ vars.STAGING_AI_DEPLOYED_DIGEST }}
        run: |
          test -n "$STAGING_SPRING_URL" && test -n "$STAGING_AI_URL"
          test -n "$SPRING_DEPLOYED" && test -n "$AI_DEPLOYED"
          node scripts/benchmark/workflow-support.mjs metadata \
            --tag '${{ needs.build-and-scan.outputs.release-tag }}' --sha '${{ github.sha }}' --workflow-run-id '${{ github.run_id }}' \
            --spring-expected "$SPRING_EXPECTED" --spring-deployed "$SPRING_DEPLOYED" \
            --ai-expected "$AI_EXPECTED" --ai-deployed "$AI_DEPLOYED" --output /tmp/validated-release.json
          echo "spring-deployed=$SPRING_DEPLOYED" >> "$GITHUB_OUTPUT"
          echo "ai-deployed=$AI_DEPLOYED" >> "$GITHUB_OUTPUT"
      - name: Readiness and critical smoke
        env:
          STAGING_SPRING_URL: ${{ vars.STAGING_SPRING_URL }}
          STAGING_AI_URL: ${{ vars.STAGING_AI_URL }}
        run: |
          curl --fail --silent --show-error "$STAGING_SPRING_URL/actuator/health"
          curl --fail --silent --show-error "$STAGING_AI_URL/ready"
          node --test scripts/test/deploy-pipeline.test.mjs

  baseline-lookup:
    if: github.event.repository.fork != true
    needs: [build-and-scan, staging-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      baseline-tag: ${{ steps.lookup.outputs.baseline-tag }}
    steps:
      - uses: actions/checkout@v4
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.build-and-scan.outputs.release-tag }}
          REQUESTED_BASELINE: ${{ inputs.baseline_release_tag }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=50" > /tmp/releases.json
          node scripts/benchmark/workflow-support.mjs baseline --input /tmp/releases.json --candidate "$CANDIDATE_TAG" --requested "$REQUESTED_BASELINE" --output /tmp/baseline.json
          echo "baseline-tag=$(node -e "const x=require('/tmp/baseline.json'); process.stdout.write(x.tag || '')")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline-${{ needs.build-and-scan.outputs.release-tag }}
          path: /tmp/baseline.json
          retention-days: 14

  comparison:
    if: github.event.repository.fork != true
    needs: [build-and-scan, staging-readiness, baseline-lookup]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      status: ${{ steps.gate.outputs.status }}
      config-hash: ${{ steps.gate.outputs.config-hash }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata-${{ needs.build-and-scan.outputs.release-tag }}
          path: artifacts/release/${{ needs.build-and-scan.outputs.release-tag }}
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-baseline-${{ needs.build-and-scan.outputs.release-tag }}
          path: benchmark/baseline
      - name: Run W2 adapter comparison
        id: compare
        continue-on-error: true
        run: |
          mkdir -p benchmark/reports
          STARTED_AT=$SECONDS
          node scripts/benchmark/workflow-support.mjs compare \
            --config .pipeline/benchmark.yml \
            --candidate artifacts/release/${{ needs.build-and-scan.outputs.release-tag }}/release.json \
            --baseline benchmark/baseline/baseline.json \
            --output benchmark/reports/comparison.json
          echo "wall-clock-seconds=$((SECONDS - STARTED_AT))" >> "$GITHUB_OUTPUT"
      - name: Create evidence manifest and summary
        id: gate
        env:
          RELEASE_TAG: ${{ needs.build-and-scan.outputs.release-tag }}
        run: |
          mkdir -p benchmark/raw benchmark/normalized benchmark/reports benchmark/onmaru-backend/$RELEASE_TAG
          cp benchmark/reports/comparison.json benchmark/raw/${{ github.run_id }}.json
          cp benchmark/reports/comparison.json benchmark/normalized/${{ github.run_id }}.json
          node scripts/benchmark/workflow-support.mjs manifest \
            --release artifacts/release/${{ needs.build-and-scan.outputs.release-tag }}/release.json \
            --baseline benchmark/baseline/baseline.json --comparison benchmark/reports/comparison.json \
            --config .pipeline/benchmark.yml --run-id '${{ github.run_id }}' \
            --output benchmark/onmaru-backend/$RELEASE_TAG/manifest.json
          node scripts/benchmark/workflow-support.mjs trend-manifest \
            --release artifacts/release/${{ needs.build-and-scan.outputs.release-tag }}/release.json \
            --config .pipeline/benchmark.yml --run-id '${{ github.run_id }}' \
            --repository '${{ github.repository }}' \
            --artifact-uri 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            --runner-profile 'ubuntu-latest-linux-amd64' \
            --toolkit-version '56862ed48797a13e4739b2fdfc2310a773a3a957' \
            --wall-clock-seconds '${{ steps.compare.outputs.wall-clock-seconds }}' \
            --output benchmark/onmaru-backend/$RELEASE_TAG/trend-manifest.json
          node scripts/benchmark/workflow-support.mjs gate --comparison benchmark/reports/comparison.json --output benchmark/onmaru-backend/$RELEASE_TAG/gate.json
          echo "## Benchmark comparison" >> "$GITHUB_STEP_SUMMARY"
          cat benchmark/reports/comparison.json >> "$GITHUB_STEP_SUMMARY"
          cat benchmark/onmaru-backend/$RELEASE_TAG/gate.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-evidence-${{ needs.build-and-scan.outputs.release-tag }}
          path: benchmark/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: trend-manifest-${{ needs.build-and-scan.outputs.release-tag }}
          path: benchmark/onmaru-backend/${{ needs.build-and-scan.outputs.release-tag }}/trend-manifest.json
          retention-days: 30
      - name: Attach trend manifest to an existing GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-scan.outputs.release-tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          MANIFEST=benchmark/onmaru-backend/$RELEASE_TAG/trend-manifest.json
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$MANIFEST#trend-manifest.json" --repo "$REPOSITORY" --clobber
          else
            echo "GitHub Release $RELEASE_TAG does not exist yet; trend manifest remains in the workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

  trend-comparison:
    if: github.event.repository.fork != true && needs.comparison.result == 'success'
    needs: [build-and-scan, baseline-lookup, comparison]
    uses: YRootLab/OnMaru-backend-ci-toolkit/.github/workflows/reusable-benchmark.yml@56862ed48797a13e4739b2fdfc2310a773a3a957
    with:
      release-tag: ${{ needs.build-and-scan.outputs.release-tag }}
      commit-sha: ${{ github.sha }}
      image-digest: ${{ needs.build-and-scan.outputs.spring-digest }}
      environment: staging
      suite: onmaru-release-smoke
      config-hash: ${{ needs.comparison.outputs.config-hash }}
      toolkit-ref: 56862ed48797a13e4739b2fdfc2310a773a3a957
      candidate-artifact-name: trend-manifest-${{ needs.build-and-scan.outputs.release-tag }}
      history-release-tags: ${{ needs.baseline-lookup.outputs.baseline-tag }}

  promotion-gate:
    if: >-
      always() && github.event.repository.fork != true && needs.comparison.result == 'success' &&
      (needs.comparison.outputs.status == 'improved' ||
      needs.comparison.outputs.status == 'unchanged' ||
      needs.comparison.outputs.status == 'inconclusive' ||
      needs.comparison.outputs.status == 'regressed')
    needs: [build-and-scan, comparison, regression-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-evidence-${{ needs.build-and-scan.outputs.release-tag }}
          path: benchmark
      - name: Block inconclusive or require regression approval
        run: |
          STATUS=$(node -e "const x=require('./benchmark/onmaru-backend/${{ needs.build-and-scan.outputs.release-tag }}/gate.json'); process.stdout.write(x.status)")
          if [ "$STATUS" = inconclusive ]; then echo 'Inconclusive benchmark blocks automatic promotion.'; exit 1; fi
          if [ "$STATUS" = regressed ]; then test '${{ needs.regression-approval.result }}' = success; exit 0; fi
          test "$STATUS" = improved || test "$STATUS" = unchanged

  regression-approval:
    if: github.event.repository.fork != true && needs.comparison.result == 'success' && needs.comparison.outputs.status == 'regressed'
    needs: [build-and-scan, comparison]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: benchmark-promotion
    steps:
      - name: Regression approval warning
        run: echo 'Regression detected. Continue only after explicit benchmark-promotion approval.'
