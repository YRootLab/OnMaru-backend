name: Build Images and Deploy

on:
  workflow_dispatch:
    inputs:
      run_staging_smoke:
        description: Run public smoke only while on-demand staging is awake
        type: boolean
        default: false
      deploy_staging:
        description: Prepare the verified develop image on sleeping Lightsail staging
        type: boolean
        default: false
      deploy_production:
        description: Deploy the latest master to production now
        type: boolean
        default: false
      rollback_production:
        description: Roll production traffic back to the retained previous Spring slot
        type: boolean
        default: false
  push:
    branches:
      - master
  schedule:
    # 03:17 KST. Avoid the top of the hour where scheduled Actions are more likely to queue.
    - cron: "17 18 * * *"

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: image-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SPRING_IMAGE: ghcr.io/yrootlab/onmaru-backend/spring-api
  AI_IMAGE: ghcr.io/yrootlab/onmaru-backend/ai-service

jobs:
  production-preflight:
    if: >-
      github.ref == 'refs/heads/master' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.deploy_production || inputs.rollback_production)))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      status: ${{ steps.status.outputs.status || steps.plan.outputs.status }}
      deploy-required: ${{ steps.status.outputs.deploy-required || steps.plan.outputs.deploy-required }}
    steps:
      - name: Select one production operation
        id: plan
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production || false }}
          ROLLBACK_PRODUCTION: ${{ inputs.rollback_production || false }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo 'mode=deploy' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DEPLOY_PRODUCTION" = true ] && [ "$ROLLBACK_PRODUCTION" = true ]; then
            echo 'Choose either deploy_production or rollback_production, not both.' >&2
            exit 1
          fi
          if [ "$ROLLBACK_PRODUCTION" = true ]; then
            echo 'mode=rollback' >> "$GITHUB_OUTPUT"
            echo 'status=rollback' >> "$GITHUB_OUTPUT"
            echo 'deploy-required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=deploy' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare restricted production SSH
        if: steps.plan.outputs.mode == 'deploy'
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          key_file=$(mktemp)
          chmod 600 "$key_file"
          printf '%s\n' "$SSH_KEY" > "$key_file"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Skip an already deployed or rollback-held master
        if: steps.plan.outputs.mode == 'deploy'
        id: status
        run: |
          trap 'rm -f "$KEY_FILE"' EXIT
          response=$(ssh -i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            onmaru-production-deployer@13.125.191.16 \
            "status $GITHUB_SHA")
          case "$response" in
            deploy)
              echo 'deploy-required=true' >> "$GITHUB_OUTPUT"
              ;;
            deployed)
              echo 'deploy-required=false' >> "$GITHUB_OUTPUT"
              ;;
            held)
              echo 'deploy-required=false' >> "$GITHUB_OUTPUT"
              echo 'The current master SHA is held after an operational rollback.' >&2
              echo 'status=held' >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            *)
              echo "Unexpected production status: $response" >&2
              exit 1
              ;;
          esac
          echo "status=$response" >> "$GITHUB_OUTPUT"

  build-and-scan-images:
    needs: production-preflight
    if: >-
      always() &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/develop' &&
      (inputs.deploy_staging || inputs.run_staging_smoke)) ||
      (needs.production-preflight.result == 'success' &&
      needs.production-preflight.outputs.deploy-required == 'true'))
    runs-on: ubuntu-latest
    outputs:
      spring-digest: ${{ steps.spring-build.outputs.digest }}
      ai-digest: ${{ steps.ai-build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Spring API image
        id: spring-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.SPRING_IMAGE }}:${{ github.sha }}
          build-args: ONMARU_BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=spring-api
          cache-to: type=gha,mode=max,scope=spring-api

      - name: Scan Spring API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SPRING_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-spring-api.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Spring API scan
        if: ${{ always() && hashFiles('trivy-spring-api.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy-spring-api.sarif
          category: spring-api

      - name: Build and push FastAPI AI image
        if: github.ref == 'refs/heads/develop'
        id: ai-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ai/Dockerfile
          push: true
          tags: ${{ env.AI_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Scan FastAPI AI image
        if: github.ref == 'refs/heads/develop'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.AI_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-ai-service.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload FastAPI AI scan
        if: github.ref == 'refs/heads/develop' && always() && hashFiles('trivy-ai-service.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy-ai-service.sarif
          category: ai-service

  migration-gate:
    if: always() && needs.build-and-scan-images.result == 'success'
    runs-on: ubuntu-latest
    needs: build-and-scan-images
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/test/requirements-contract.txt

      - name: Install contract validator dependencies
        run: python -m pip install -r scripts/test/requirements-contract.txt

      - name: Validate generated contracts before migration
        run: bash scripts/verify-contracts

      - name: Rehearse migration gate
        env:
          ONMARU_DB_MIGRATION_USER: ${{ secrets.ONMARU_STAGING_DB_MIGRATION_USER }}
          ONMARU_DB_MIGRATION_PASSWORD: ${{ secrets.ONMARU_STAGING_DB_MIGRATION_PASSWORD }}
          ONMARU_DB_RUNTIME_USER: ${{ secrets.ONMARU_STAGING_DB_RUNTIME_USER }}
          ONMARU_DB_RUNTIME_PASSWORD: ${{ secrets.ONMARU_STAGING_DB_RUNTIME_PASSWORD }}
        run: |
          test -n "$ONMARU_DB_MIGRATION_USER"
          test -n "$ONMARU_DB_RUNTIME_USER"
          test "$ONMARU_DB_MIGRATION_USER" != "$ONMARU_DB_RUNTIME_USER"
          ./gradlew :apps:spring-api:test --tests '*Migration*' --no-daemon

  staging-deploy:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_staging &&
      github.ref == 'refs/heads/develop' &&
      needs.build-and-scan-images.result == 'success' &&
      needs.migration-gate.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - build-and-scan-images
      - migration-gate
    environment: staging
    permissions:
      contents: read
      packages: read
      checks: read
    steps:
      - name: Require successful CI verify for this develop commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "verify" and .conclusion == "success" and .app.slug == "github-actions")] | length')
          test "$count" -ge 1 || { echo 'CI verify has not passed for this develop commit.' >&2; exit 1; }

      - name: Prepare image on sleeping Lightsail staging
        env:
          SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          SPRING_DIGEST: ${{ needs.build-and-scan-images.outputs.spring-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$SPRING_DIGEST" && test -n "$GH_TOKEN"
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$SSH_KEY" > "$key_file"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$GH_TOKEN" | ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            onmaru-staging-deployer@13.125.191.16 \
            "deploy $GITHUB_SHA $SPRING_DIGEST $GITHUB_ACTOR"

  staging-smoke:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_staging_smoke &&
      needs.build-and-scan-images.result == 'success' &&
      needs.migration-gate.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - build-and-scan-images
      - migration-gate
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record image digests
        run: |
          mkdir -p docs/operations/release-evidence/staging
          {
            echo "spring-api=${{ needs.build-and-scan-images.outputs.spring-digest }}"
            echo "ai-service=${{ needs.build-and-scan-images.outputs.ai-digest }}"
          } > docs/operations/release-evidence/staging/image-digests.env

      - name: Run staging smoke contract
        env:
          STAGING_SPRING_URL: ${{ vars.STAGING_SPRING_URL }}
        run: |
          node --test scripts/test/deploy-pipeline.test.mjs
          test -f infra/staging/release-plan.json
          test "$STAGING_SPRING_URL" = 'https://staging-api.onmaru.site'
          curl --fail --silent --show-error --output /dev/null "$STAGING_SPRING_URL/auth/csrf"
          # AI staging service is not provisioned yet. Re-enable this check with Issue #490
          # after registering a real STAGING_AI_URL and connecting the AI image deployment.

  rollback-on-failure:
    runs-on: ubuntu-latest
    needs:
      - build-and-scan-images
      - migration-gate
      - staging-smoke
    if: >-
      failure() &&
      (needs.build-and-scan-images.result == 'success' ||
      needs.migration-gate.result == 'success' ||
      needs.staging-smoke.result == 'failure')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require previous release digest for rollback
        env:
          PREVIOUS_SPRING_DIGEST: ${{ vars.PREVIOUS_SPRING_DIGEST }}
          PREVIOUS_AI_DIGEST: ${{ vars.PREVIOUS_AI_DIGEST }}
        run: |
          test -n "$PREVIOUS_SPRING_DIGEST"
          test -n "$PREVIOUS_AI_DIGEST"
          echo "Rollback target digests are present."

  production-deploy:
    if: >-
      always() &&
      github.ref == 'refs/heads/master' &&
      needs.production-preflight.result == 'success' &&
      needs.production-preflight.outputs.deploy-required == 'true' &&
      needs.build-and-scan-images.result == 'success' &&
      needs.migration-gate.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - production-preflight
      - build-and-scan-images
      - migration-gate
    environment: production
    permissions:
      contents: read
      packages: read
      checks: read
    steps:
      - name: Require successful CI verify for this master commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "verify" and .conclusion == "success" and .app.slug == "github-actions")] | length')
          test "$count" -ge 1 || { echo 'CI verify has not passed for this master commit.' >&2; exit 1; }

      - name: Deploy immutable Spring image with bounded Blue-Green overlap
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
          SPRING_DIGEST: ${{ needs.build-and-scan-images.outputs.spring-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$SPRING_DIGEST" && test -n "$GH_TOKEN"
          case "$SPRING_DIGEST" in sha256:*) ;; *) echo 'Invalid Spring image digest.' >&2; exit 1;; esac
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$SSH_KEY" > "$key_file"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$GH_TOKEN" | ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            onmaru-production-deployer@13.125.191.16 \
            "deploy $GITHUB_SHA $SPRING_DIGEST $GITHUB_ACTOR"

  production-rollback:
    if: >-
      always() &&
      needs.production-preflight.result == 'success' &&
      needs.production-preflight.outputs.mode == 'rollback' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.rollback_production
    runs-on: ubuntu-latest
    needs:
      - production-preflight
    environment: production
    permissions:
      contents: read
    steps:
      - name: Roll back to the retained previous Spring slot
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$SSH_KEY" > "$key_file"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            onmaru-production-deployer@13.125.191.16 \
            "rollback $GITHUB_ACTOR"

  notify-production:
    if: always() && needs.production-preflight.result != 'skipped'
    runs-on: ubuntu-latest
    needs:
      - production-preflight
      - build-and-scan-images
      - migration-gate
      - production-deploy
      - production-rollback
    environment: production
    permissions:
      contents: read
    steps:
      - name: Send production deployment result webhook
        env:
          WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}
          MODE: ${{ needs.production-preflight.outputs.mode }}
          STATUS: ${{ needs.production-preflight.outputs.status }}
          PREFLIGHT_RESULT: ${{ needs.production-preflight.result }}
          BUILD_RESULT: ${{ needs.build-and-scan-images.result }}
          MIGRATION_RESULT: ${{ needs.migration-gate.result }}
          DEPLOY_RESULT: ${{ needs.production-deploy.result }}
          ROLLBACK_RESULT: ${{ needs.production-rollback.result }}
        run: |
          test -n "$WEBHOOK_URL"
          if [ "$STATUS" = held ]; then
            outcome=rollback-held
          elif [ "$PREFLIGHT_RESULT" != success ]; then
            outcome="preflight-$PREFLIGHT_RESULT"
          elif [ "$STATUS" = deployed ]; then
            outcome=no-op
          elif [ "$MODE" = rollback ]; then
            outcome="rollback-$ROLLBACK_RESULT"
          elif [ "$BUILD_RESULT" != success ]; then
            outcome="build-$BUILD_RESULT"
          elif [ "$MIGRATION_RESULT" != success ]; then
            outcome="migration-$MIGRATION_RESULT"
          else
            outcome="deploy-$DEPLOY_RESULT"
          fi
          message="OnMaru production $outcome | preflight=$PREFLIGHT_RESULT build=$BUILD_RESULT migration=$MIGRATION_RESULT deploy=$DEPLOY_RESULT rollback=$ROLLBACK_RESULT | $GITHUB_SHA | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -n --arg content "$message" --arg text "$message" '{content: $content, text: $text}')
          curl --fail --silent --show-error --retry 2 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$WEBHOOK_URL" >/dev/null
